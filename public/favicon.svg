<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .ground { fill: #FBFAF7 }
    .dot    { fill: #1D1A17 }
    .accent { fill: #AD472E }
    @media (prefers-color-scheme: dark) {
      .ground { fill: #120F0C }
      .dot    { fill: #EAE7E3 }
      .accent { fill: #E2805E }
    }
  </style>
  <rect class="ground" width="64" height="64" rx="13"/>
  <g class="dot">
    <circle cx="21" cy="21" r="8"/>
    <circle cx="43" cy="21" r="8"/>
    <circle cx="21" cy="43" r="8"/>
  </g>
  <circle class="accent" cx="43" cy="43" r="8"/>
</svg>
